name: Docs

# Render-check the Scribble documentation. The published docs are built
# automatically by the Racket package server (docs.racket-lang.org/xgboost/)
# when the package is updated on pkgs.racket-lang.org; this workflow just
# guarantees the source still renders without errors.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: '8.17'
          variant: 'CS'
          distribution: 'full'
      - name: Render Scribble docs
        # The literate Examples chapter cross-references the `xgboost` collection
        # by name (`(for-label xgboost)`, and `(require xgboost)` inside the woven
        # example code). Put the repo root on PLTCOLLECTS so that name resolves to
        # ./xgboost without installing the package — rendering only needs the
        # bindings for label phase, not the native library.
        run: |
          PLTCOLLECTS="$GITHUB_WORKSPACE:" raco scribble --html \
            --dest _site \
            ++xref-in setup/xref load-collections-xref \
            --redirect-main https://docs.racket-lang.org/ \
            xgboost/scribblings/xgboost.scrbl
      - name: Upload rendered docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: _site
